<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List Advanced</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #333;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 15px;
      width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
    }

    .input-group {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }

    input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 10px;
      border: none;
      background: #6c63ff;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    .filters {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
    }

    .filters button {
      flex: 1;
      margin: 2px;
      background: #ddd;
      color: black;
    }

    ul {
      list-style: none;
      padding: 0;
      max-height: 250px;
      overflow-y: auto;
    }

    li {
      background: #f1f1f1;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    li.completed span {
      text-decoration: line-through;
      color: gray;
    }

    .actions button {
      margin-left: 5px;
      padding: 5px 8px;
      border-radius: 5px;
    }

    .delete { background: red; color: white; }
    .edit { background: orange; color: white; }

    .dark-mode {
      background: #222;
      color: white;
    }

    .dark-mode .container {
      background: #333;
      color: white;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>✨ To-Do List</h2>

  <div class="input-group">
    <input type="text" id="taskInput" placeholder="Tambah tugas...">
    <button onclick="addTask()">Tambah</button>
  </div>

  <div class="filters">
    <button onclick="filterTasks('all')">Semua</button>
    <button onclick="filterTasks('active')">Aktif</button>
    <button onclick="filterTasks('completed')">Selesai</button>
  </div>

  <ul id="taskList"></ul>

  <button onclick="toggleDarkMode()">🌙 Dark Mode</button>
</div>

<script>
  let tasks = [];

  function saveToLocal() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
  }

  function loadFromLocal() {
    const data = localStorage.getItem("tasks");
    if (data) {
      tasks = JSON.parse(data);
      renderTasks();
    }
  }

  function addTask() {
    const input = document.getElementById("taskInput");
    const text = input.value.trim();

    if (!text) return alert("Isi dulu tugasnya!");

    tasks.push({ text, completed: false });
    input.value = "";
    saveToLocal();
    renderTasks();
  }

  function renderTasks(filter = "all") {
    const list = document.getElementById("taskList");
    list.innerHTML = "";

    tasks.forEach((task, index) => {
      if (filter === "active" && task.completed) return;
      if (filter === "completed" && !task.completed) return;

      const li = document.createElement("li");
      if (task.completed) li.classList.add("completed");

      const span = document.createElement("span");
      span.textContent = task.text;
      span.onclick = () => toggleTask(index);

      const actions = document.createElement("div");
      actions.className = "actions";

      const delBtn = document.createElement("button");
      delBtn.textContent = "Hapus";
      delBtn.className = "delete";
      delBtn.onclick = () => deleteTask(index);

      const editBtn = document.createElement("button");
      editBtn.textContent = "Edit";
      editBtn.className = "edit";
      editBtn.onclick = () => editTask(index);

      actions.appendChild(editBtn);
      actions.appendChild(delBtn);

      li.appendChild(span);
      li.appendChild(actions);
      list.appendChild(li);
    });
  }

  function toggleTask(index) {
    tasks[index].completed = !tasks[index].completed;
    saveToLocal();
    renderTasks();
  }

  function deleteTask(index) {
    tasks.splice(index, 1);
    saveToLocal();
    renderTasks();
  }

  function editTask(index) {
    const newText = prompt("Edit tugas:", tasks[index].text);
    if (newText) {
      tasks[index].text = newText;
      saveToLocal();
      renderTasks();
    }
  }

  function filterTasks(type) {
    renderTasks(type);
  }

  function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");
  }

  loadFromLocal();
</script>

</body>
</html>
